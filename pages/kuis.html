<!-- SECTION 5: KUIS EVALUASI (Adegan 5 / F10) -->
    <section id="kuis" class="view-section">
      <div class="breadcrumb">
        <a onclick="navigateTo('beranda')">Beranda</a>
        <span class="sep">/</span>
        <a onclick="navigateTo('modul1')">Modul 1</a>
        <span class="sep">/</span>
        <span class="current">Kuis Evaluasi</span>
      </div>

      <div class="quiz-card">
        <div class="quiz-top-info">
          <span>Soal 3 dari 10</span>
          <span>Ambang Tuntas: &ge; 75</span>
        </div>

        <div class="progress-bar-container" style="margin-bottom: 22px;">
          <div class="progress-bar-fill" style="width: 30%; background: var(--amber);"></div>
        </div>

        <h2 style="color: var(--navy); margin-bottom: 8px;">Prinsip desain apa yang ditunjukkan pada pembagian bobot setara pada karya?</h2>
        <p class="small" style="margin-bottom: 20px;">
          Perhatikan karya yang memiliki pembagian bobot visual seimbang di kedua sisinya sehingga susunan tidak terasa berat sebelah.
        </p>

        <div id="quizOptionsList">
          <button class="quiz-option" data-opt="unity" onclick="selectQuizOption(this, 'unity')">
            <span style="width: 24px; font-weight:700;">A.</span> Unity (Kesatuan)
          </button>
          <button class="quiz-option" data-opt="balance" onclick="selectQuizOption(this, 'balance')">
            <span style="width: 24px; font-weight:700;">B.</span> Balance (Keseimbangan)
          </button>
          <button class="quiz-option" data-opt="rhythm" onclick="selectQuizOption(this, 'rhythm')">
            <span style="width: 24px; font-weight:700;">C.</span> Rhythm (Irama)
          </button>
          <button class="quiz-option" data-opt="emphasis" onclick="selectQuizOption(this, 'emphasis')">
            <span style="width: 24px; font-weight:700;">D.</span> Emphasis (Penekanan)
          </button>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;">
          <button class="btn-primary" id="btnCheckQuiz" onclick="checkQuizAnswer()" disabled>
            Periksa Jawaban
          </button>
          <button class="btn-secondary" onclick="resetQuiz()">Ulangi Soal</button>
        </div>

        <div id="quizFeedbackBox" style="margin-top: 16px;"></div>
      </div>
    </section>
